<!DOCTYPE html>
<html>

<body>
    <h1>Punto Digital:</h1>
    <form>
        // Practicas/Form/index.html
        <fieldset>
            <legend>Registre sus datos:</legend>
            <label for="fname">Nombres:</label><br>
            <input type="text" id="fname" name="fname" value=""><br>
            <label for="lname">Apellido:</label><br>
            <input type="text" id="lname" name="lname" value=""><br>
            <label for="years">Edad:</label><br>
            <input type="text" id="years" name="years" value=""><br>
            <br>
            <button type="button" onclick="alert('Registro completado')">Registrar</button>
        </fieldset>
        <fieldset>
            <legend>Defina su conectividad:</legend>
            <form>
                <input type="radio" id="no" name="disp" value="si">
                <label for="si"></label>Cuento con computadora personal<br>
                <input type="radio" id="si" name="disp" value="no">
                <label for="no">No cuento con computadora personal</label>
            </form>
        </fieldset>
        <fieldset>
            <legend>Elija su Curso:</legend>
            <form>
                <input type="checkbox" id="Desarrollo Web" name="curso" value="Desarrollo Web">
                <label for="Desarrollo Web">Desarrollo Web</label><br>
                <input type="checkbox" id="Diseño Grafico" name="curso" value="Diseño Grafico">
                <label for="Diseño Grafico">Disenio Grafico</label><br>
                <input type="checkbox" id="Produccion Musical" name="curso" value="Produccion Musical">
                <label for="Produccion Musical">Produccion Musical</label>
            </form>
        </fieldset>
        <fieldset>
            <legend>Defina su contrasenia:</legend>
            <label for="pwd">Contrasenia:</label><br>
            <input type="text" id="pwd" name="pwd" value=""><br>
        </fieldset>
    </form>
</body>

</html>
